experiment:
  name: paper_phase2_day1_b0_b1
  phase: paper_phase2
  benchmark: benchmark_v2
  purpose: validation_diagnostic_only
  seed: 42

data:
  train: data/processed/benchmark_v2/train.pkl
  validation: data/processed/benchmark_v2/val.pkl
  test_access_allowed: false

data_policy:
  statistics_source: clean_train_only
  tuning_split: validation_only
  model_visible_fields:
    - model_visible_sequence
    - gender
    - age_group
  forbidden_model_inputs:
    - label
    - anomaly_type
    - hidden_eval_metadata
    - audit_metadata
  ontology_allowed: false

b0:
  alpha: 1.0
  rare_quantile: 0.05
  scores:
    - max_token_surprisal
    - mean_negative_log_frequency
    - rare_code_fraction

b1:
  alpha: 0.5
  min_support: 5
  quantile: 0.90
  bottom_k: 5
  scores:
    - worst_relation
    - mean_relation
    - q90_relation
    - topk_relation
    - npmi_anomaly
    - confidence_anomaly
    - lift_anomaly

bias_audit:
  sequence_length: true
  candidate_pair_count: true
  train_derived_length_bins: true

artifact_policy:
  commit_per_record_scores: false
  commit_aggregate_metrics_only: true
