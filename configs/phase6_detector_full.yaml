# Phase 6 -- FULL detector config (GPU-oriented; full benchmark-v2 train normals).
# Sgen is disabled (w_gen = 0). Trains on ALL clean-normal train sequences.
experiment_name: phase6_detector_full
seed: 42
data_dir: data/processed/benchmark_v2
train_split: train.pkl
val_split: val.pkl
test_split: test.pkl
sequence_key: model_visible_sequence
label_key: label
model_type: unsupervised_next_token_gru
embed_dim: 128
hidden_dim: 128
num_layers: 1
dropout: 0.2
max_len: 256
batch_size: 64
epochs: 25
lr: 0.001
weight_decay: 0.00001
early_stopping_patience: 5
early_stopping_metric: val_roc_auc
train_cap: 0          # 0 = all normal train sequences
device: auto          # cuda if available, else cpu
num_workers: 0
output_dir: artifacts/phase6/runs
checkpoint_policy: best_and_last
calibration_policy: val_best_f1
resume: true
sgen_enabled: false
evidence_level: full_gpu
scoring_weights:
  w_det: 0.70
  w_ont: 0.30
  w_gen: 0.0
